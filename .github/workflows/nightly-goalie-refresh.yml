name: Nightly Goalie Refresh

on:
  schedule:
    # GitHub Actions uses UTC. One entry is 1:00 AM PDT and the other is 1:00 AM PST.
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the refresh at 1 AM Vancouver time
        env:
          EVENT_NAME: ${{ github.event_name }}
          REFRESH_URL: ${{ secrets.RENDER_REFRESH_URL }}
          REFRESH_SECRET: ${{ secrets.NHL_REFRESH_SECRET }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] && [ "$(TZ=America/Vancouver date +%H)" != "01" ]; then
            exit 0
          fi
          curl --fail-with-body --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            --request POST "${REFRESH_URL}/api/internal/refresh" \
            --header "X-Refresh-Secret: ${REFRESH_SECRET}"
