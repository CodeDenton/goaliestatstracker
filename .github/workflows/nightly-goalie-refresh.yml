name: Nightly Goalie Refresh

on:
  schedule:
    # 09:00 UTC is 1:00 AM PST and 2:00 AM PDT: safely after the latest games.
    # Use one trigger and do not check the actual start time, since GitHub can
    # delay scheduled jobs by several hours.
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the overnight refresh
        env:
          REFRESH_URL: ${{ secrets.RENDER_REFRESH_URL }}
          REFRESH_SECRET: ${{ secrets.NHL_REFRESH_SECRET }}
        run: |
          curl --fail-with-body --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            --request POST "${REFRESH_URL}/api/internal/refresh" \
            --header "X-Refresh-Secret: ${REFRESH_SECRET}"
