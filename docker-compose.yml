services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: creasevision
      POSTGRES_USER: creasevision
      POSTGRES_PASSWORD: creasevision
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creasevision -d creasevision"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      PORT: 8080
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: creasevision
      PGUSER: creasevision
      PGPASSWORD: creasevision
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
