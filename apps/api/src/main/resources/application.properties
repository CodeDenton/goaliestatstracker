spring.application.name=api

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Existing Supabase databases were created by Hibernate. Flyway records that
# legacy state at version 1, then applies every later migration normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Legacy Hibernate schema
spring.flyway.clean-disabled=true

nhl.season=${NHL_SEASON:20262027}
nhl.situation=2
nhl.refresh-on-startup=true
nhl.refresh.cron=0 0 1 * * *
nhl.refresh.zone=America/Vancouver
nhl.refresh-secret=${NHL_REFRESH_SECRET:}
