spring.datasource.url=jdbc:h2:mem:creasevision-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=false

# A context-load test must never issue a live NHL request.
nhl.refresh-on-startup=false
nhl.refresh.cron=0 0 1 * * *
nhl.refresh.zone=America/Vancouver
